<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1A3A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Spielsystem">
<title>Spielsystem 26/27</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#1A3A5C;--blue:#2563EB;--green:#15803D;--purple:#6D28D9;--orange:#C2410C;
  --gray-50:#F8FAFC;--gray-100:#F1F5F9;--gray-200:#E2E8F0;--gray-400:#94A3B8;
  --gray-600:#475569;--gray-900:#0F172A;--white:#fff;
}
html,body{height:100%;overscroll-behavior:none}
body{font-family:"DM Sans",sans-serif;background:var(--gray-50);color:var(--gray-900);
  padding-bottom:calc(62px + env(safe-area-inset-bottom));overflow-x:hidden}

/* HEADER */
.hdr{background:var(--navy);padding:14px 16px 12px;position:sticky;top:0;z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back-btn{background:rgba(255,255,255,.12);border:none;border-radius:8px;
  color:white;width:34px;height:34px;font-size:18px;cursor:pointer;
  display:none;align-items:center;justify-content:center;flex-shrink:0}
.back-btn.show{display:flex}
.hdr-titles{flex:1;min-width:0}
.hdr-title{color:white;font-size:17px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{color:rgba(255,255,255,.45);font-size:11px;margin-top:1px}
.search-wrap{position:relative}
.search-input{width:100%;background:rgba(255,255,255,.12);
  border:1.5px solid rgba(255,255,255,.15);border-radius:10px;
  color:white;padding:9px 36px 9px 36px;
  font-family:"DM Sans",sans-serif;font-size:15px;outline:none;transition:.15s}
.search-input::placeholder{color:rgba(255,255,255,.35)}
.search-input:focus{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
.s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:15px;opacity:.45;pointer-events:none}
.s-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,.2);border:none;border-radius:50%;
  width:20px;height:20px;color:white;font-size:11px;cursor:pointer;
  display:none;align-items:center;justify-content:center}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:white;
  border-top:1px solid var(--gray-200);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);z-index:50;
  box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.bnav-btn{background:none;border:none;cursor:pointer;padding:8px 4px 6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--gray-400);transition:color .15s}
.bnav-btn .bi{font-size:21px;line-height:1}
.bnav-btn .bl{font-size:9px;font-weight:700;letter-spacing:.3px}
.bnav-btn.active{color:var(--navy)}

/* SCREENS */
.screen{display:none;padding:12px;animation:up .15s ease}
.screen.active{display:block}
@keyframes up{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* HOME */
.home-section-title{font-size:11px;font-weight:700;color:var(--gray-400);
  text-transform:uppercase;letter-spacing:1.5px;margin:0 2px 8px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.cat-tile{background:white;border-radius:14px;padding:14px 12px;
  box-shadow:0 1px 6px rgba(0,0,0,.07);cursor:pointer;
  display:flex;flex-direction:column;gap:5px;
  border-top:3px solid var(--navy);transition:box-shadow .12s;
  -webkit-user-select:none;user-select:none}
.cat-tile:active{box-shadow:0 3px 14px rgba(0,0,0,.13)}
.cat-icon{font-size:26px;line-height:1}
.cat-name{font-size:14px;font-weight:800;color:var(--gray-900)}
.cat-count{font-size:11px;color:var(--gray-400)}

/* LIST */
.topic-list{display:flex;flex-direction:column;gap:8px}
.topic-item{background:white;border-radius:12px;padding:13px 14px;
  box-shadow:0 1px 5px rgba(0,0,0,.06);cursor:pointer;
  display:flex;align-items:center;gap:12px;
  transition:box-shadow .12s;-webkit-user-select:none;user-select:none}
.topic-item:active{box-shadow:0 2px 12px rgba(0,0,0,.12)}
.topic-icon{font-size:20px;width:38px;height:38px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topic-text{flex:1;min-width:0}
.topic-name{font-size:15px;font-weight:700;color:var(--gray-900)}
.topic-hint{font-size:11.5px;color:var(--gray-400);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic-arrow{color:var(--gray-300);font-size:16px;flex-shrink:0}

/* DETAIL */
.detail-card{background:white;border-radius:14px;
  box-shadow:0 1px 6px rgba(0,0,0,.07);overflow:hidden;margin-bottom:10px}
.detail-tag{display:inline-block;font-size:10px;font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;padding:3px 8px;
  border-radius:4px;margin:12px 14px 0;background:var(--gray-100);color:var(--gray-600)}

/* KEYPOINTS */
.keypoints{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.kp{display:flex;gap:10px;align-items:flex-start}
.kp-dot{width:7px;height:7px;border-radius:50%;background:var(--navy);
  flex-shrink:0;margin-top:8px}
.kp-text{font-size:16px;font-weight:700;color:var(--gray-900);line-height:1.3}
.kp-sub{font-size:13px;font-weight:400;color:var(--gray-600);margin-top:3px;line-height:1.5}

/* ROWS */
.rows{border-top:1px solid var(--gray-100)}
.row{display:flex;border-bottom:1px solid var(--gray-100);min-height:38px}
.row:last-child{border-bottom:none}
.rk{width:36%;padding:8px 10px;font-size:12px;font-weight:700;
  color:var(--navy);background:var(--gray-50);
  border-right:1px solid var(--gray-100);
  display:flex;align-items:flex-start;line-height:1.4}
.rv{flex:1;padding:8px 10px;font-size:13px;color:var(--gray-600);line-height:1.5}

/* PHASE TABLE */
.ph-hd{display:grid;grid-template-columns:18% 1fr;background:var(--navy)}
.ph-hd span{padding:6px 9px;font-size:10px;font-weight:700;
  color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.8px}
.ph-row{display:grid;grid-template-columns:18% 1fr;border-bottom:1px solid var(--gray-100)}
.ph-row:last-child{border-bottom:none}
.ph-row:nth-child(odd) .ph-cell{background:var(--gray-50)}
.ph-cell{padding:9px 10px;font-size:13px;line-height:1.45;border-right:1px solid var(--gray-100)}
.ph-cell:last-child{border-right:none;color:var(--gray-600)}
.ph-cell.lbl{font-weight:800;color:var(--navy);font-size:11px}

/* VORTEIL TABLE */
.v-hd{display:grid;grid-template-columns:24% 38% 1fr;background:var(--navy)}
.v-hd span{padding:6px 9px;font-size:10px;font-weight:700;
  color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.8px}
.v-row{display:grid;grid-template-columns:24% 38% 1fr;border-bottom:1px solid var(--gray-100)}
.v-row:last-child{border-bottom:none}
.v-row:nth-child(odd) .v-cell{background:var(--gray-50)}
.v-cell{padding:8px 9px;font-size:12px;line-height:1.45;border-right:1px solid var(--gray-100)}
.v-cell:last-child{border-right:none;color:#B91C1C;font-size:11.5px}
.v-cell.lbl{font-weight:700;color:var(--navy)}

/* COURT */
.court-wrap{padding:12px 14px}
.court-img{width:100%;border-radius:10px;display:block}

/* MOTIONS */
.motion-list{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.motion{background:var(--gray-50);border-radius:8px;padding:10px 12px;
  border-left:3px solid var(--blue);cursor:pointer}
.motion-name{font-size:14px;font-weight:700;color:var(--navy);
  display:flex;justify-content:space-between;align-items:center}
.m-chev{font-size:10px;color:var(--gray-400);transition:transform .2s}
.motion.open .m-chev{transform:rotate(180deg)}
.motion-desc{font-size:12.5px;color:var(--gray-600);line-height:1.5;
  margin-top:5px;display:none}
.motion.open .motion-desc{display:block}

/* NOTE */
.note{padding:6px 14px 12px;font-size:11.5px;color:var(--gray-400);font-style:italic}

/* SEARCH */
.s-count{font-size:12px;color:var(--gray-400);font-weight:500;padding:0 2px 8px}
.s-empty{text-align:center;padding:48px 16px;color:var(--gray-400);font-size:15px}
.s-empty .se-emoji{font-size:40px;display:block;margin-bottom:8px}
.s-item{background:white;border-radius:12px;padding:12px 14px;
  box-shadow:0 1px 5px rgba(0,0,0,.06);margin-bottom:8px;cursor:pointer;
  border-left:4px solid var(--gray-200);transition:box-shadow .12s}
.s-item:active{box-shadow:0 2px 12px rgba(0,0,0,.12)}
.s-item.defense{border-left-color:var(--navy)}
.s-item.offense{border-left-color:var(--green)}
.s-item.transition{border-left-color:var(--purple)}
.s-item.prinzip{border-left-color:var(--orange)}
.s-item.zonen{border-left-color:var(--blue)}
.s-item.grundlage{border-left-color:var(--gray-400)}
.s-meta{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.s-badge{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;background:var(--gray-100);color:var(--gray-600)}
.s-badge.defense{background:#EFF6FF;color:var(--navy)}
.s-badge.offense{background:#F0FDF4;color:var(--green)}
.s-badge.transition{background:#F5F3FF;color:var(--purple)}
.s-badge.prinzip{background:#FFF7ED;color:var(--orange)}
.s-badge.zonen{background:#EFF6FF;color:var(--blue)}
.s-title{font-size:15px;font-weight:700;color:var(--gray-900);margin-bottom:2px}
.s-hint{font-size:12px;color:var(--gray-400)}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <button class="back-btn" id="back-btn" onclick="goBack()">←</button>
    <div class="hdr-titles">
      <div class="hdr-title" id="hdr-title">Spielsystem 26/27</div>
      <div class="hdr-sub" id="hdr-sub">Weddinger Wiesel 2</div>
    </div>
  </div>
  <div class="search-wrap">
    <span class="s-icon">🔍</span>
    <input class="search-input" id="q" type="search"
      placeholder="Suchen: Closeout, PnR, Split, Backdoor…"
      autocomplete="off" autocorrect="off" autocapitalize="off">
    <button class="s-clear" id="s-clear">✕</button>
  </div>
</header>

<div class="screen active" id="s-home"></div>
<div class="screen" id="s-list"></div>
<div class="screen" id="s-detail"></div>
<div class="screen" id="s-search"></div>

<nav class="bnav">
  <button class="bnav-btn active" id="bn-home" onclick="goHome()">
    <span class="bi">🏠</span><span class="bl">Home</span>
  </button>
  <button class="bnav-btn" id="bn-defense" onclick="openCat('defense')">
    <span class="bi">🛡</span><span class="bl">Defense</span>
  </button>
  <button class="bnav-btn" id="bn-offense" onclick="openCat('offense')">
    <span class="bi">⚡</span><span class="bl">Offense</span>
  </button>
  <button class="bnav-btn" id="bn-transition" onclick="openCat('transition')">
    <span class="bi">🔄</span><span class="bl">Trans.</span>
  </button>
  <button class="bnav-btn" id="bn-zonen" onclick="openCat('zonen')">
    <span class="bi">🗺</span><span class="bl">Zonen</span>
  </button>
</nav>

<script>
const CATS = {
  grundlage:{ name:'Grundlage', icon:'🧠', color:'#374151', bg:'#F9FAFB' },
  prinzip:  { name:'Prinzipien', icon:'💡', color:'#C2410C', bg:'#FFF7ED' },
  defense:  { name:'Defense',    icon:'🛡', color:'#1A3A5C', bg:'#EFF6FF' },
  offense:  { name:'Offense',    icon:'⚡', color:'#15803D', bg:'#F0FDF4' },
  transition:{ name:'Transition',icon:'🔄', color:'#6D28D9', bg:'#F5F3FF' },
  zonen:    { name:'15 Zonen',   icon:'🗺', color:'#2563EB', bg:'#EFF6FF' },
};

const TOPICS = [
  // GRUNDLAGE
  { id:'gl-1', cat:'grundlage', icon:'⚡', name:'Wie Basketball funktioniert',
    hint:'Positionsvorteil · Numerischer Vorteil · Vorteil-Zerstörer',
    keys:'vorteil positionsvorteil numerisch spacing tempo kollektiv iso heroball drive kick fastbreak warum philosophie übergewicht grundlage basketball',
    content:{ type:'grundlage' }
  },

  // PRINZIPIEN
  { id:'gl-1', cat:'prinzip', icon:'🧠', name:'Wie Basketball funktioniert',
    hint:'Positionsvorteil · Numerischer Vorteil · Vorteil-Zerstörer',
    keys:'vorteil positionsvorteil numerisch spacing tempo kollektiv iso heroball drive kick fastbreak warum philosophie übergewicht grundlage basketball',
    content:{ type:'grundlage' }
  },
  { id:'pr-1', cat:'prinzip', icon:'🎯', name:'1 — Wir wollen den Ball',
    hint:'Ballgewinn · Live-Ball-Turnover · Sofort in Bewegung',
    keys:'ballgewinn turnover live ball scoren angreifen besitzen outlet rim runner deny dribbling töten wollen ball',
    content:{ type:'phase', sub:'Wir verteidigen nicht um zu überleben. Wir greifen an um zu scoren.',
      rows:[
        ['Defense','Verteidigen heißt Ballgewinn vorbereiten. Richtung steuern → Dribbling töten → Full-Deny auf toten Dribbler'],
        ['Trans. O','Nach Ballgewinn sofort in Bewegung. Outlet anbieten, Rollen besetzen, Vorteil vor gesetzter Defense nutzen'],
        ['Offense','Kein Live-Ball-Turnover. Schwieriger Wurf aus guter Situation ok — riskanter Pass in Verkehr nicht'],
        ['Trans. D','Ball stoppen — sofort, bedingungslos. Erster Schritt zurück ohne Zuweisung'],
      ]}
  },
  { id:'pr-2', cat:'prinzip', icon:'📐', name:'2 — Raum ist die Währung',
    hint:'Spacing · Weakside · Rollen besetzen',
    keys:'spacing raum zone weakside leer abstand 3er linie weg dribbler rollen wing corner rim runner trailer split line währung',
    content:{ type:'phase', sub:'Raum entsteht nicht — er wird geschaffen. Von allen fünf, die ganze Zeit.',
      rows:[
        ['Defense','Raum einengen — Optionen nehmen. Help-Struktur auf Split-Line. Weakside nie offen lassen'],
        ['Trans. O','Rollen besetzen bevor der Gegner steht. Wing sprintet, Rim Runner läuft, Trailer folgt'],
        ['Offense','Max. 1 Spieler pro Zone. Auf/hinter 3er-Linie. Weakside nie leer. Nicht zum Dribbler — weg'],
        ['Trans. D','Erst Ball stoppen, dann Korb schließen — beides im Sprint. Sort-out danach'],
      ]}
  },
  { id:'pr-3', cat:'prinzip', icon:'👁', name:'3 — Lies, dann handle',
    hint:'2 Beats · Closeout Read · Im Sprint identifizieren',
    keys:'lesen read beats triple threat entscheidung 2 sekunden closeout schütze driver pnr kommunikation sprint zuweisung aufbauen angreifen lies handle',
    content:{ type:'phase', sub:'Das System gibt dir den Kontext. Die Entscheidung triffst du.',
      rows:[
        ['Defense','Closeout: Schütze oder Driver? PnR: Kommunikation vor der Aktion — antizipieren, nicht reagieren'],
        ['Trans. O','Lieber aufbauen als unkontrolliert angreifen. Entscheidung in 2 Sekunden'],
        ['Offense','Erst lesen (2 Beats), dann agieren. Triple Threat. Reihenfolge: Korb → Mitspieler → Reset'],
        ['Trans. D','Im Sprint identifizieren. Wer steht hat zu spät gelesen'],
      ]}
  },
  { id:'pr-4', cat:'prinzip', icon:'🤝', name:'4 — 5 einfache schlagen 1 brillante',
    hint:'Kollektiv · Heroball · Help ist das System',
    keys:'kollektiv heroball einfach brillant help system ball you man helpside mismatch switch trailer fastbreak kick out swing geduld sort out niemand alleine',
    content:{ type:'phase', sub:'Kollektiv schlägt Individuum. Immer.',
      rows:[
        ['Defense','Help ist das System — keine Option. Niemand verteidigt alleine. Mismatch nach Switch von Helpside gesichert'],
        ['Trans. O','Trailer oft besser als Fastbreak-Abschluss. Die einfachere Entscheidung ist meistens richtig'],
        ['Offense','Kein Heroball. Sofort Kick-out beim Collaps. Geduld bis zum 2./3. Swing'],
        ['Trans. D','Sort-out ist Teamaufgabe. Kommunikation im Sprint — kein Warten auf Zuweisung'],
      ]}
  },
  { id:'pr-5', cat:'prinzip', icon:'⏱', name:'5 — Jede Phase beginnt bevor sie beginnt',
    hint:'Übergänge · Sofort umschalten · Outlet-Guard',
    keys:'übergänge umschalten ballverlust outlet rebound sprint zurück sofort freiwurf tote ball aufstellen wurf transition beginnt',
    content:{ type:'phase', sub:'Übergänge sind keine Pause. Wer wartet hat schon verloren.',
      rows:[
        ['Defense','Beginnt beim eigenen Ballverlust. Sofort umschalten — nicht warten bis der Gegner steht'],
        ['Trans. O','Beginnt beim Defensiv-Rebound. Outlet-Guard sofort anbieten. Big wirft ein, Guard schon in Bewegung'],
        ['Offense','Beginnt beim Stopp der Defense. Nach Ballgewinn sofort Outlet. Nach Freiwurf sofort aufstellen'],
        ['Trans. D','Beginnt beim eigenen Wurf. Vor Abschluss wissen wer zurückläuft'],
      ]}
  },

  // DEFENSE
  { id:'def-onball', cat:'defense', icon:'🏃', name:'On-Ball Defense',
    hint:'Richtung · Dribbling töten · Reach-ins',
    keys:'on ball ballführer richtung steuern sideline baseline dribbling stirbt deny toten dribbler reach in füße arme abstand brust aktiv',
    content:{ type:'keypoints', points:[
      { main:'Ein Arm-Länge Abstand', sub:'Beine schulterbreit · tief bleiben · Brust auf den Ball' },
      { main:'Richtung steuern', sub:'Außenfuß zurück → Mitte blockieren → zur Sideline/Baseline zwingen' },
      { main:'Dribbling stirbt → sofort Full-Deny', sub:'Keine Lücke lassen auf toten Dribbler' },
      { main:'Reach-ins verboten', sub:'Füße bewegen, nicht die Arme' },
    ]}
  },
  { id:'def-onepaway', cat:'defense', icon:'👁', name:'One Pass Away',
    hint:'Open Deny · Backdoor · Einrücken',
    keys:'one pass away open deny open stance backdoor cut ball stirbt full deny einrücken shooter passlinie abstand recovern toten dribbler',
    content:{ type:'rows', rows:[
      ['Grundposition','Open Stance: Rücken zur Baseline · einen Schritt Richtung Ball · Mann und Ball im Blickfeld'],
      ['Ziel','Pass erlaubt — Druck auf Dribbler maximieren · Drive-Help-ready'],
      ['Backdoor-Cut','Kopf drehen → mit dem Mann zur Baseline gleiten · kein 180°'],
      ['Ball stirbt','Sofort einrücken → Full-Deny auf toten Dribbler'],
      ['Ausnahme','Gegen bekannte Shooter → situativ auf Full-Deny schalten'],
    ]}
  },
  { id:'def-help', cat:'defense', icon:'🤝', name:'Help Defense',
    hint:'Ball-You-Man · Split-Line · High/Low',
    keys:'help helpside two passes away split line ball you man blickfeld high low skip pass closeout weakside elbow block',
    content:{ type:'keypoints', points:[
      { main:'Ball-You-Man', sub:'Eine Hand zeigt auf Ball, eine auf Mann · beides im Blickfeld' },
      { main:'Auf der Split-Line stehen', sub:'Ball unter FW-Linie → Fuß auf Split-Line' },
      { main:'High-I vs Low-I', sub:'Gegner oben → High Help (Elbow) · Gegner unten → Low Help (Block-Nähe)' },
      { main:'Skip-Pass → sofort Closeout', sub:'Nie Mann aus den Augen verlieren' },
    ]}
  },
  { id:'def-closeout', cat:'defense', icon:'🚀', name:'Closeout',
    hint:'Schütze oder Driver · Ankunft · Contest',
    keys:'closeout anflug schütze driver außenhand shot contest innenhand drive catch foul zwischen korb lesen',
    content:{ type:'keypoints', points:[
      { main:'Im Anflug: Schütze oder Driver lesen', sub:'Bekannter Schütze → mehr Druck · bekannter Driver → mehr Abstand' },
      { main:'Außenhand hoch, Innenhand low', sub:'Shot-Contest ohne Foul · Drive-Lane blockieren' },
      { main:'Nach Closeout sofort Stance', sub:'Lesen: Schuss, Drive oder Pass' },
    ]}
  },
  { id:'def-post', cat:'defense', icon:'🏋️', name:'Post Defense',
    hint:'Dreiviertel · Fronten · High-Low',
    keys:'post defense dreiviertel fronten lob helpside block freiwurflinie high low big innen',
    content:{ type:'rows', rows:[
      ['Ball über FW-Linie','Dreiviertel-Stellung: Arm + Bein ballseitig davor'],
      ['Ball unter FW-Linie','Fronten — Helpside sichert Lob'],
      ['Post geht weg','Hinter den Post → normal verteidigen'],
    ]}
  },
  { id:'def-pnr', cat:'defense', icon:'🔀', name:'Pick & Roll Defense',
    hint:'Hedge · Switch · 3rd Man',
    keys:'pick and roll pnr hedge switch guard big roller 3rd man mismatch coverage drop kommunikation antizipieren zögern konsequent screen',
    content:{ type:'keypoints', points:[
      { main:'Default: Hedge', sub:'Guard kämpft über den Pick · Big tritt hart raus · 3rd Man sichert Roller ab' },
      { main:'Kommunikation vor der Aktion', sub:'Antizipieren, nicht reagieren — einmal gecallt konsequent durchziehen' },
      { main:'Switch (in Vorbereitung definiert)', sub:'1-4 oder 1-5 · Mismatch nach Switch von Helpside gesichert' },
    ]}
  },

  // OFFENSE
  { id:'off-stance', cat:'offense', icon:'🧭', name:'Off-Ball Stance',
    hint:'Spacing · Backdoor · Relocate',
    keys:'off ball stance spacing abstand 3er linie defender backdoor v-cut relocate cut screen penetration flare stehen bleiben bewegen weg dribbler',
    content:{ type:'keypoints', points:[

// ── CONTENT RENDERERS ──
function renderContent(t, cat) {
  const c = t.content;
  const color = cat.color || '#1A3A5C';
  const bg = cat.bg || '#F1F5F9';
  const tagHtml = `<span class="detail-tag" style="background:${bg};color:${color}">${cat.name}</span>`;

  if (c.type === 'keypoints') {
    return `<div class="detail-card">${tagHtml}
      <div class="keypoints">${c.points.map(p =>
        `<div class="kp"><div class="kp-dot" style="background:${color}"></div>
        <div><div class="kp-text">${p.main}</div>${p.sub?`<div class="kp-sub">${p.sub}</div>`:''}</div></div>`
      ).join('')}</div></div>`;
  }
  if (c.type === 'rows') {
    return `<div class="detail-card">${tagHtml}
      <div class="rows">${c.rows.map(([k,v]) =>
        `<div class="row"><div class="rk">${k}</div><div class="rv">${v}</div></div>`
      ).join('')}</div></div>`;
  }
  if (c.type === 'phase') {
    return `<div class="detail-card">${tagHtml}
      <div class="keypoints"><div style="font-size:13px;color:#6B7280;font-style:italic;padding-bottom:2px">${c.sub}</div></div>
      <div class="ph-hd"><span>Phase</span><span>Kern + Beispiel</span></div>
      ${c.rows.map(([ph,txt]) =>
        `<div class="ph-row"><div class="ph-cell lbl">${ph}</div><div class="ph-cell">${txt}</div></div>`
      ).join('')}</div>`;
  }
  if (c.type === 'motions') {
    return `<div class="detail-card">${tagHtml}
      <div class="motion-list">${c.items.map(([name,desc,img]) =>

// ── STATE ──
let currentCat = null;
let navStack = [];
let searchHits = [];

// ── RENDER HOME ──
function renderHome() {
  const el = document.getElementById('s-home');
  const sections = [
    { label:'Grundlage & Prinzipien', keys:['prinzip'] },
    { label:'Spielphasen', keys:['defense','offense','transition','zonen'] },
  ];
  el.innerHTML = sections.map(sec =>
    `<div class="home-section-title">${sec.label}</div>
    <div class="cat-grid">${sec.keys.map(k => {
      const cat = CATS[k];
      const count = TOPICS.filter(t=>t.cat===k).length;
      return `<div class="cat-tile" style="border-top-color:${cat.color}" onclick="openCat('${k}')">
        <div class="cat-icon">${cat.icon}</div>
        <div class="cat-name">${cat.name}</div>
        <div class="cat-count">${count} Themen</div>
      </div>`;
    }).join('')}</div>`
  ).join('');
}

// ── RENDER LIST ──
function renderList(catKey) {
  const cat = CATS[catKey];
  const topics = TOPICS.filter(t => t.cat === catKey);
  document.getElementById('s-list').innerHTML =
    '<div class="topic-list">' + topics.map(t =>
      `<div class="topic-item" onclick="openDetail('${t.id}')">
        <div class="topic-icon" style="background:${cat.bg}">${t.icon}</div>
        <div class="topic-text">
          <div class="topic-name">${t.name}</div>
          <div class="topic-hint">${t.hint}</div>
        </div>
        <span class="topic-arrow">›</span>
      </div>`
    ).join('') + '</div>';
}

// ── RENDER DETAIL ──
function renderDetail(topicId) {
  const t = TOPICS.find(x => x.id === topicId);
  if (!t) return;
  const cat = CATS[t.cat] || {};
  document.getElementById('s-detail').innerHTML = renderContent(t, cat);
}

// ── NAVIGATION ──
function setNav(name, sub, showBack, activeCat) {
  document.getElementById('hdr-title').textContent = name;
  document.getElementById('hdr-sub').textContent = sub;
  document.getElementById('back-btn').classList.toggle('show', showBack);
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.remove('active'));
  if (activeCat) document.getElementById('bn-' + activeCat)?.classList.add('active');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function goHome() {
  currentCat = null; navStack = [];
  setNav('Spielsystem 26/27', 'Weddinger Wiesel 2', false, 'home');
  showScreen('s-home');
}

function openCat(catKey) {
  currentCat = catKey;
  const cat = CATS[catKey];
  const count = TOPICS.filter(t=>t.cat===catKey).length;
  renderList(catKey);
  navStack = ['home'];
  setNav(cat.name, count + ' Themen', true, catKey==='grundlage'||catKey==='prinzip'?'home':catKey);
  showScreen('s-list');
}

function openDetail(topicId) {
  const t = TOPICS.find(x => x.id === topicId);
  if (!t) return;
  renderDetail(topicId);
  navStack.push('list');
  setNav(t.name, t.hint, true, null);
  showScreen('s-detail');
}

function goBack() {
  const prev = navStack.pop();
  if (!prev || prev === 'home') goHome();
  else {
    const cat = CATS[currentCat];
    const count = TOPICS.filter(t=>t.cat===currentCat).length;
    setNav(cat.name, count + ' Themen', true, currentCat==='grundlage'||currentCat==='prinzip'?'home':currentCat);
    showScreen('s-list');
  }
}

// ── SEARCH ──
const tagLabels = {defense:'Defense',offense:'Offense',transition:'Trans.',prinzip:'Prinzip',zonen:'15 Zonen',grundlage:'Grundlage'};

function doSearch(raw) {
  const q = raw.trim();
  document.getElementById('s-clear').style.display = q ? 'flex' : 'none';
  if (q.length < 2) { goHome(); return; }
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  searchHits = TOPICS.filter(t => {
    const hay = (t.name+' '+t.hint+' '+t.keys).toLowerCase();
    return terms.every(x => hay.includes(x));
  });
  const el = document.getElementById('s-search');
  if (!searchHits.length) {
    el.innerHTML = `<div class="s-empty"><span class="se-emoji">🤷</span>Nichts gefunden für „${q}"</div>`;
  } else {
    el.innerHTML = `<div class="s-count">${searchHits.length} Ergebnis${searchHits.length!==1?'se':''} für „${q}"</div>` +
      searchHits.map((t,i) =>
        `<div class="s-item ${t.cat}" onclick="goToHit(${i})">
          <div class="s-meta"><span class="s-badge ${t.cat}">${tagLabels[t.cat]||t.cat}</span></div>
          <div class="s-title">${t.icon} ${t.name}</div>
          <div class="s-hint">${t.hint}</div>
        </div>`
      ).join('');
  }
  setNav('Suche', q, false, 'home');
  showScreen('s-search');
}

function goToHit(i) {
  const t = searchHits[i];
  document.getElementById('q').value = '';
  document.getElementById('s-clear').style.display = 'none';
  currentCat = t.cat;
  openDetail(t.id);
  navStack = ['home','list'];
}

document.getElementById('q').addEventListener('input', e => doSearch(e.target.value));
document.getElementById('s-clear').addEventListener('click', () => {
  document.getElementById('q').value = ''; doSearch('');
  document.getElementById('q').focus();
});

// ── INIT ──
renderHome();
goHome();

// PWA

  const sw = `self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',()=>clients.claim());`;

  navigator.serviceWorker.register(URL.createObjectURL(blob));
  const m={name:'Spielsystem 26/27',short_name:'Spielsystem',display:'standalone',background_color:'#1A3A5C',theme_color:'#1A3A5C',start_url:'./'};
  const mb=new Blob([JSON.stringify(m)],{type:'application/manifest+json'});
  const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(mb);
  document.head.appendChild(ml);
}
